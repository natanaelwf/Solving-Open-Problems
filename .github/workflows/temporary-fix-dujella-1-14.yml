name: Temporary Problem 1.14 rendering validation

on:
  push:
    branches:
      - fix-dujella-1-14-math-rendering

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the correction branch
        uses: actions/checkout@v4
        with:
          ref: fix-dujella-1-14-math-rendering
          fetch-depth: 0

      - name: Lint the complete mathematical article
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("dujella-problem-1.14/README.md")
          text = path.read_text(encoding="utf-8")

          if "$$" in text:
              raise SystemExit("Forbidden $$ delimiter found")

          forbidden_source_patterns = {
              r"\\operatorname\*?": r"\operatorname",
              r"\\tag\b": r"\tag",
              r"\\boxed\b": r"\boxed",
              r"\\begin\{array\}": r"\begin{array}",
              r"\\newcommand\b": r"\newcommand",
              r"\\renewcommand\b": r"\renewcommand",
              r"\\DeclareMathOperator\b": r"\DeclareMathOperator",
              r"\\def\b": r"\def",
              r"\\require\b": r"\require",
          }
          for pattern, label in forbidden_source_patterns.items():
              if re.search(pattern, text):
                  raise SystemExit(f"Forbidden or unsafe macro found: {label}")

          block_pattern = re.compile(r"```math\n(.*?)\n```", re.DOTALL)
          blocks = block_pattern.findall(text)
          if text.count("```math") != len(blocks):
              raise SystemExit("Unbalanced or malformed math fences")
          if len(blocks) != 90:
              raise SystemExit(f"Expected 90 display-math blocks, found {len(blocks)}")

          inline = []
          in_math_fence = False
          for line_number, line in enumerate(text.splitlines(), start=1):
              if line == "```math":
                  if in_math_fence:
                      raise SystemExit(f"Nested math fence at line {line_number}")
                  in_math_fence = True
                  continue
              if line == "```" and in_math_fence:
                  in_math_fence = False
                  continue
              if in_math_fence:
                  continue

              line = re.sub(r"`[^`]*`", "", line)
              dollar_positions = [
                  match.start()
                  for match in re.finditer(r"(?<!\\)\$", line)
              ]
              if len(dollar_positions) % 2:
                  raise SystemExit(f"Unpaired inline dollar delimiter at line {line_number}")
              for start, end in zip(dollar_positions[0::2], dollar_positions[1::2]):
                  inline.append((line_number, line[start + 1:end]))

          if in_math_fence:
              raise SystemExit("Unclosed math fence at end of file")

          expressions = [("block", i + 1, value) for i, value in enumerate(blocks)]
          expressions += [(f"inline line {line}", i + 1, value) for i, (line, value) in enumerate(inline)]

          for kind, number, expression in expressions:
              if not expression.strip():
                  raise SystemExit(f"Empty {kind} expression #{number}")
              if "<" in expression or ">" in expression:
                  raise SystemExit(f"Literal angle bracket in {kind} expression #{number}")

              stack = []
              for match in re.finditer(r"\\(begin|end)\{([^{}]+)\}", expression):
                  action, env = match.groups()
                  if action == "begin":
                      stack.append(env)
                  elif not stack or stack.pop() != env:
                      raise SystemExit(f"Mismatched environment in {kind} expression #{number}")
              if stack:
                  raise SystemExit(f"Unclosed environment in {kind} expression #{number}: {stack}")

              depth = 0
              escaped = False
              for char in expression:
                  if escaped:
                      escaped = False
                      continue
                  if char == "\\":
                      escaped = True
                      continue
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f"Extra closing brace in {kind} expression #{number}")
              if depth:
                  raise SystemExit(f"Unbalanced braces in {kind} expression #{number}: depth {depth}")

          required_counts = {
              r"\mathrm{Sq}": 8,
              r"\mathrm{lc}": 2,
              r"\mathrm{rank}": 1,
          }
          for token, expected in required_counts.items():
              actual = text.count(token)
              if actual != expected:
                  raise SystemExit(f"Expected {expected} occurrences of {token}, found {actual}")

          commands = sorted(set(re.findall(r"\\([A-Za-z]+)", "\n".join(value for _, _, value in expressions))))
          expected_rendered = len(blocks) + len(inline)
          Path(".expected-math-renderers").write_text(str(expected_rendered), encoding="ascii")
          print("LaTeX commands used:", ", ".join(commands))
          print(f"Validated {len(blocks)} display blocks and {len(inline)} inline expressions")
          print(f"Expected rendered mathematics elements: {expected_rendered}")
          PY

          git diff --check

      - name: Inspect the commit-specific page rendered by GitHub
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          url="https://github.com/natanaelwf/Solving-Open-Problems/blob/${sha}/dujella-problem-1.14/README.md"
          success=0
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error \
              --header "User-Agent: Problem-1.14-render-audit" \
              "$url" > rendered.html; then
              if grep --quiet "Degree-Uniform Bounds for Polynomial Diophantine Tuples" rendered.html; then
                success=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "Could not retrieve the rendered GitHub page" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("rendered.html").read_text(encoding="utf-8")
          expected = int(Path(".expected-math-renderers").read_text(encoding="ascii"))

          forbidden_messages = (
              "The following macros are not allowed",
              "Missing close brace",
              "Undefined control sequence",
              "Math input error",
              "MathJax error",
              "ParseError",
          )
          lowered = html.lower()
          for message in forbidden_messages:
              if message.lower() in lowered:
                  raise SystemExit(f"GitHub rendered an error message: {message}")

          if r"\operatorname" in html:
              raise SystemExit("Rendered HTML still contains a residual operatorname command")

          opened = len(re.findall(r"<math-renderer\b", html))
          closed = html.count("</math-renderer>")
          if opened != closed:
              raise SystemExit(f"Unbalanced math-renderer elements: {opened} openings, {closed} closings")
          if opened != expected:
              raise SystemExit(
                  f"Source/render mismatch: expected {expected} math-renderer elements, found {opened}"
              )

          renderers = re.findall(r"<math-renderer\b.*?</math-renderer>", html, flags=re.DOTALL)
          if len(renderers) != expected:
              raise SystemExit(
                  f"Could not isolate every rendered expression: expected {expected}, isolated {len(renderers)}"
              )
          for index, renderer in enumerate(renderers, start=1):
              if not re.search(r"<(?:math|mjx-container)\b", renderer):
                  raise SystemExit(f"Rendered expression #{index} lacks mathematical output")

          print(f"GitHub rendered all {opened} source expressions without a detected error message")
          PY
