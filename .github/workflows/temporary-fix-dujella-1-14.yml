name: Temporary Problem 1.14 rendering validation

on:
  push:
    branches:
      - fix-dujella-1-14-math-rendering

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the correction branch
        uses: actions/checkout@v4
        with:
          ref: fix-dujella-1-14-math-rendering
          fetch-depth: 0

      - name: Lint every mathematical expression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path("dujella-problem-1.14/README.md")
          text = path.read_text(encoding="utf-8")

          forbidden_source_patterns = {
              r"\$\$": "$$",
              r"\\operatorname\*?": r"\operatorname",
              r"\\tag\b": r"\tag",
              r"\\boxed\b": r"\boxed",
              r"\\begin\{array\}": r"\begin{array}",
              r"\\newcommand\b": r"\newcommand",
              r"\\renewcommand\b": r"\renewcommand",
              r"\\DeclareMathOperator\b": r"\DeclareMathOperator",
              r"\\def\b": r"\def",
              r"\\require\b": r"\require",
          }
          for pattern, label in forbidden_source_patterns.items():
              if re.search(pattern, text):
                  raise SystemExit(f"Forbidden or unsafe source construct found: {label}")

          block_pattern = re.compile(r"```math\n(.*?)\n```", re.DOTALL)
          block_matches = list(block_pattern.finditer(text))
          blocks = [match.group(1) for match in block_matches]
          if text.count("```math") != len(blocks):
              raise SystemExit("Unbalanced or malformed math fences")
          if len(blocks) != 90:
              raise SystemExit(f"Expected 90 display-math blocks, found {len(blocks)}")

          expressions = []
          for index, match in enumerate(block_matches, start=1):
              line = text.count("\n", 0, match.start()) + 1
              expressions.append({"kind": "display", "index": index, "line": line, "tex": match.group(1)})

          inline = []
          in_math_fence = False
          for line_number, line in enumerate(text.splitlines(), start=1):
              if line == "```math":
                  if in_math_fence:
                      raise SystemExit(f"Nested math fence at line {line_number}")
                  in_math_fence = True
                  continue
              if line == "```" and in_math_fence:
                  in_math_fence = False
                  continue
              if in_math_fence:
                  continue

              line_without_code = re.sub(r"`[^`]*`", "", line)
              dollar_positions = [match.start() for match in re.finditer(r"(?<!\\)\$", line_without_code)]
              if len(dollar_positions) % 2:
                  raise SystemExit(f"Unpaired inline dollar delimiter at line {line_number}")
              for start, end in zip(dollar_positions[0::2], dollar_positions[1::2]):
                  inline.append((line_number, line_without_code[start + 1:end]))

          if in_math_fence:
              raise SystemExit("Unclosed math fence at end of file")
          if len(inline) != 469:
              raise SystemExit(f"Expected 469 inline expressions, found {len(inline)}")

          for index, (line, tex) in enumerate(inline, start=1):
              expressions.append({"kind": "inline", "index": index, "line": line, "tex": tex})

          for expression in expressions:
              tex = expression["tex"]
              label = f'{expression["kind"]} expression #{expression["index"]} at line {expression["line"]}'
              if not tex.strip():
                  raise SystemExit(f"Empty {label}")
              if "<" in tex or ">" in tex:
                  raise SystemExit(f"Literal angle bracket in {label}")

              stack = []
              for match in re.finditer(r"\\(begin|end)\{([^{}]+)\}", tex):
                  action, env = match.groups()
                  if action == "begin":
                      stack.append(env)
                  elif not stack or stack.pop() != env:
                      raise SystemExit(f"Mismatched environment in {label}")
              if stack:
                  raise SystemExit(f"Unclosed environment in {label}: {stack}")

              depth = 0
              escaped = False
              for char in tex:
                  if escaped:
                      escaped = False
                      continue
                  if char == "\\":
                      escaped = True
                      continue
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f"Extra closing brace in {label}")
              if depth:
                  raise SystemExit(f"Unbalanced braces in {label}: depth {depth}")

          required_counts = {
              r"\mathrm{Sq}": 8,
              r"\mathrm{lc}": 2,
              r"\mathrm{rank}": 1,
          }
          for token, expected in required_counts.items():
              actual = text.count(token)
              if actual != expected:
                  raise SystemExit(f"Expected {expected} occurrences of {token}, found {actual}")

          commands = sorted(set(re.findall(r"\\([A-Za-z]+)", "\n".join(item["tex"] for item in expressions))))
          Path("source-math.json").write_text(
              json.dumps(expressions, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          Path("validated-commit.txt").write_text(
              __import__('subprocess').check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              encoding="ascii",
          )
          Path("validated-article-blob.txt").write_text(
              __import__('subprocess').check_output(['git', 'hash-object', str(path)], text=True).strip(),
              encoding="ascii",
          )
          print("LaTeX commands used:", ", ".join(commands))
          print(f"Validated {len(blocks)} display blocks and {len(inline)} inline expressions")
          print(f"Expected rendered mathematics elements: {len(expressions)}")
          PY

          git diff --check

      - name: Verify source-to-GitHub parser correspondence
        shell: bash
        run: |
          sha="$(cat validated-commit.txt)"
          url="https://github.com/natanaelwf/Solving-Open-Problems/blob/${sha}/dujella-problem-1.14/README.md"
          curl --fail --location --silent --show-error \
            --header "User-Agent: Problem-1.14-render-audit" \
            "$url" > server-page.html

          python - <<'PY'
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class EmbeddedDataParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and dict(attrs).get("data-target") == "react-app.embeddedData":
                      self.capture = True
              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      self.capture = False
              def handle_data(self, data):
                  if self.capture:
                      self.parts.append(data)

          source = json.loads(Path("source-math.json").read_text(encoding="utf-8"))
          expected_display = [item["tex"] for item in source if item["kind"] == "display"]
          expected_inline = [item["tex"] for item in source if item["kind"] == "inline"]

          parser = EmbeddedDataParser()
          parser.feed(Path("server-page.html").read_text(encoding="utf-8"))
          if not parser.parts:
              raise SystemExit("Could not locate GitHub's embedded rendered Markdown payload")
          payload = json.loads("".join(parser.parts))
          rich = payload["payload"]["codeViewBlobRoute"]["richText"]

          pattern = re.compile(
              r'<math-renderer class="js-(inline|display)-math"[^>]*>(.*?)</math-renderer>',
              re.DOTALL,
          )
          actual_inline = []
          actual_display = []
          for kind, value in pattern.findall(rich):
              value = unescape(value).strip()
              if kind == "inline":
                  if not (value.startswith("$") and value.endswith("$")):
                      raise SystemExit(f"Malformed inline math-renderer payload: {value!r}")
                  actual_inline.append(value[1:-1])
              else:
                  if not (value.startswith("$$") and value.endswith("$$")):
                      raise SystemExit(f"Malformed display math-renderer payload: {value!r}")
                  actual_display.append(value[2:-2])

          def normalize(value):
              return re.sub(r"\s+", " ", value).strip()
          def normalize_display(value):
              value = normalize(value)
              return re.sub(r"\\{3}(?=\s|&)", r"\\\\", value)

          if len(actual_inline) != len(expected_inline):
              raise SystemExit(f"Inline parser mismatch: expected {len(expected_inline)}, found {len(actual_inline)}")
          if len(actual_display) != len(expected_display):
              raise SystemExit(f"Display parser mismatch: expected {len(expected_display)}, found {len(actual_display)}")

          for index, (expected, actual) in enumerate(zip(expected_inline, actual_inline), start=1):
              if normalize(expected) != normalize(actual):
                  raise SystemExit(
                      f"Inline expression {index} changed during GitHub parsing:\n"
                      f"expected: {expected!r}\nactual: {actual!r}"
                  )
          for index, (expected, actual) in enumerate(zip(expected_display, actual_display), start=1):
              if normalize_display(expected) != normalize_display(actual):
                  raise SystemExit(
                      f"Display expression {index} changed during GitHub parsing:\n"
                      f"expected: {expected!r}\nactual: {actual!r}"
                  )

          if r"\operatorname" in rich:
              raise SystemExit("Residual operatorname command found in GitHub's rendered payload")
          print(f"GitHub parser preserved all {len(actual_display)} display and {len(actual_inline)} inline expressions.")
          PY

      - name: Install Chromium and Playwright
        shell: bash
        run: |
          npm --silent init -y
          npm --silent install playwright
          npx playwright install --with-deps chromium

      - name: Audit the live GitHub page in a real browser
        shell: bash
        run: |
          cat > browser-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const sha = fs.readFileSync('validated-commit.txt', 'utf8').trim();
          const source = JSON.parse(fs.readFileSync('source-math.json', 'utf8'));
          const expectedDisplay = source.filter(x => x.kind === 'display').length;
          const expectedInline = source.filter(x => x.kind === 'inline').length;
          const expectedTotal = expectedDisplay + expectedInline;
          const url = `https://github.com/natanaelwf/Solving-Open-Problems/blob/${sha}/dujella-problem-1.14/README.md`;
          const outputDir = 'browser-audit';
          fs.mkdirSync(outputDir, { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const reports = [];
          const viewports = [
            { name: 'wide', width: 1440, height: 5000 },
            { name: 'narrow', width: 430, height: 5000 },
          ];
          const forbiddenMessages = [
            'The following macros are not allowed',
            'Missing close brace',
            'Undefined control sequence',
            'Math input error',
            'MathJax error',
            'ParseError',
          ];

          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
                reducedMotion: 'reduce',
              });
              const page = await context.newPage();
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
              await page.waitForFunction(
                count => document.querySelectorAll('math-renderer').length === count,
                expectedTotal,
                { timeout: 120000 },
              );
              await page.waitForTimeout(10000);

              const pageText = await page.locator('body').innerText();
              for (const message of forbiddenMessages) {
                if (pageText.toLowerCase().includes(message.toLowerCase())) {
                  throw new Error(`${viewport.name}: GitHub displayed an error message: ${message}`);
                }
              }

              const result = await page.evaluate(() => {
                const elements = [...document.querySelectorAll('math-renderer')];
                const article = document.querySelector('article.markdown-body');
                const articleRect = article?.getBoundingClientRect();
                return {
                  pageHeight: document.documentElement.scrollHeight,
                  articleWidth: articleRect?.width ?? null,
                  articleScrollWidth: article?.scrollWidth ?? null,
                  articleClientWidth: article?.clientWidth ?? null,
                  documentScrollWidth: document.documentElement.scrollWidth,
                  documentClientWidth: document.documentElement.clientWidth,
                  display: elements.filter(e => e.classList.contains('js-display-math')).map((e, index) => {
                    const rect = e.getBoundingClientRect();
                    return {
                      index: index + 1,
                      visibleText: e.innerText ?? '',
                      html: e.innerHTML,
                      shadow: e.shadowRoot?.innerHTML ?? null,
                      width: rect.width,
                      height: rect.height,
                      scrollWidth: e.scrollWidth,
                      clientWidth: e.clientWidth,
                    };
                  }),
                  inline: elements.filter(e => e.classList.contains('js-inline-math')).map((e, index) => {
                    const rect = e.getBoundingClientRect();
                    return {
                      index: index + 1,
                      visibleText: e.innerText ?? '',
                      html: e.innerHTML,
                      shadow: e.shadowRoot?.innerHTML ?? null,
                      width: rect.width,
                      height: rect.height,
                      scrollWidth: e.scrollWidth,
                      clientWidth: e.clientWidth,
                    };
                  }),
                };
              });

              if (result.display.length !== expectedDisplay) {
                throw new Error(`${viewport.name}: expected ${expectedDisplay} display expressions, found ${result.display.length}`);
              }
              if (result.inline.length !== expectedInline) {
                throw new Error(`${viewport.name}: expected ${expectedInline} inline expressions, found ${result.inline.length}`);
              }

              for (const expression of [...result.display, ...result.inline]) {
                const combined = `${expression.visibleText}\n${expression.html}\n${expression.shadow ?? ''}`;
                for (const message of forbiddenMessages) {
                  if (combined.toLowerCase().includes(message.toLowerCase())) {
                    throw new Error(`${viewport.name}: expression ${expression.index} contains error message: ${message}`);
                  }
                }
                if (!expression.visibleText.trim()) {
                  throw new Error(`${viewport.name}: expression ${expression.index} has no visible mathematical text`);
                }
                if (!(expression.width > 0) || !(expression.height > 0)) {
                  throw new Error(`${viewport.name}: expression ${expression.index} has a zero-sized rendered box`);
                }
              }

              if (result.documentScrollWidth > result.documentClientWidth + 2) {
                throw new Error(
                  `${viewport.name}: the page has horizontal overflow: ` +
                  `${result.documentScrollWidth} versus ${result.documentClientWidth}`
                );
              }

              const chunkDir = `${outputDir}/${viewport.name}`;
              fs.mkdirSync(chunkDir, { recursive: true });
              const step = viewport.height - 150;
              let chunk = 0;
              for (let y = 0; y < result.pageHeight; y += step) {
                await page.evaluate(scrollY => window.scrollTo(0, scrollY), y);
                await page.waitForTimeout(160);
                await page.screenshot({
                  path: `${chunkDir}/page-${String(chunk + 1).padStart(3, '0')}.jpg`,
                  type: 'jpeg',
                  quality: 82,
                  fullPage: false,
                });
                chunk++;
              }

              reports.push({
                viewport,
                url,
                ...result,
                screenshots: chunk,
              });
              await context.close();
            }
          } finally {
            await browser.close();
          }

          fs.writeFileSync(`${outputDir}/browser-report.json`, JSON.stringify(reports, null, 2));
          console.log(`Browser audit passed for ${expectedDisplay} display and ${expectedInline} inline expressions in both viewports.`);
          JS

          node browser-audit.mjs

      - name: Preserve browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem-1-14-browser-audit-final
          path: |
            source-math.json
            validated-commit.txt
            validated-article-blob.txt
            server-page.html
            browser-audit/
          if-no-files-found: error
          retention-days: 2
