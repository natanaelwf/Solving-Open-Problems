name: Temporary Problem 1.14 rendering validation

on:
  push:
    branches:
      - fix-dujella-1-14-math-rendering

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the correction branch
        uses: actions/checkout@v4
        with:
          ref: fix-dujella-1-14-math-rendering
          fetch-depth: 0

      - name: Lint the complete mathematical article
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path("dujella-problem-1.14/README.md")
          text = path.read_text(encoding="utf-8")

          if "$$" in text:
              raise SystemExit("Forbidden $$ delimiter found")

          forbidden_source_patterns = {
              r"\\operatorname\*?": r"\operatorname",
              r"\\tag\b": r"\tag",
              r"\\boxed\b": r"\boxed",
              r"\\begin\{array\}": r"\begin{array}",
              r"\\newcommand\b": r"\newcommand",
              r"\\renewcommand\b": r"\renewcommand",
              r"\\DeclareMathOperator\b": r"\DeclareMathOperator",
              r"\\def\b": r"\def",
              r"\\require\b": r"\require",
          }
          for pattern, label in forbidden_source_patterns.items():
              if re.search(pattern, text):
                  raise SystemExit(f"Forbidden or unsafe macro found: {label}")

          block_pattern = re.compile(r"```math\n(.*?)\n```", re.DOTALL)
          block_matches = list(block_pattern.finditer(text))
          blocks = [match.group(1) for match in block_matches]
          if text.count("```math") != len(blocks):
              raise SystemExit("Unbalanced or malformed math fences")
          if len(blocks) != 90:
              raise SystemExit(f"Expected 90 display-math blocks, found {len(blocks)}")

          expressions = []
          for index, match in enumerate(block_matches, start=1):
              line = text.count("\n", 0, match.start()) + 1
              expressions.append({"kind": "display", "index": index, "line": line, "tex": match.group(1)})

          inline = []
          in_math_fence = False
          for line_number, line in enumerate(text.splitlines(), start=1):
              if line == "```math":
                  if in_math_fence:
                      raise SystemExit(f"Nested math fence at line {line_number}")
                  in_math_fence = True
                  continue
              if line == "```" and in_math_fence:
                  in_math_fence = False
                  continue
              if in_math_fence:
                  continue

              line_without_code = re.sub(r"`[^`]*`", "", line)
              dollar_positions = [
                  match.start()
                  for match in re.finditer(r"(?<!\\)\$", line_without_code)
              ]
              if len(dollar_positions) % 2:
                  raise SystemExit(f"Unpaired inline dollar delimiter at line {line_number}")
              for start, end in zip(dollar_positions[0::2], dollar_positions[1::2]):
                  inline.append((line_number, line_without_code[start + 1:end]))

          if in_math_fence:
              raise SystemExit("Unclosed math fence at end of file")

          for index, (line, tex) in enumerate(inline, start=1):
              expressions.append({"kind": "inline", "index": index, "line": line, "tex": tex})

          for expression in expressions:
              tex = expression["tex"]
              label = f'{expression["kind"]} expression #{expression["index"]} at line {expression["line"]}'
              if not tex.strip():
                  raise SystemExit(f"Empty {label}")
              if "<" in tex or ">" in tex:
                  raise SystemExit(f"Literal angle bracket in {label}")

              stack = []
              for match in re.finditer(r"\\(begin|end)\{([^{}]+)\}", tex):
                  action, env = match.groups()
                  if action == "begin":
                      stack.append(env)
                  elif not stack or stack.pop() != env:
                      raise SystemExit(f"Mismatched environment in {label}")
              if stack:
                  raise SystemExit(f"Unclosed environment in {label}: {stack}")

              depth = 0
              escaped = False
              for char in tex:
                  if escaped:
                      escaped = False
                      continue
                  if char == "\\":
                      escaped = True
                      continue
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f"Extra closing brace in {label}")
              if depth:
                  raise SystemExit(f"Unbalanced braces in {label}: depth {depth}")

          required_counts = {
              r"\mathrm{Sq}": 8,
              r"\mathrm{lc}": 2,
              r"\mathrm{rank}": 1,
          }
          for token, expected in required_counts.items():
              actual = text.count(token)
              if actual != expected:
                  raise SystemExit(f"Expected {expected} occurrences of {token}, found {actual}")

          commands = sorted(set(re.findall(r"\\([A-Za-z]+)", "\n".join(item["tex"] for item in expressions))))
          Path("source-math.json").write_text(
              json.dumps(expressions, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print("LaTeX commands used:", ", ".join(commands))
          print(f"Validated {len(blocks)} display blocks and {len(inline)} inline expressions")
          print(f"Source mathematics elements: {len(expressions)}")
          PY

          git diff --check

      - name: Inspect the commit-specific page rendered by GitHub
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          url="https://github.com/natanaelwf/Solving-Open-Problems/blob/${sha}/dujella-problem-1.14/README.md"
          success=0
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error \
              --header "User-Agent: Problem-1.14-render-audit" \
              "$url" > rendered.html; then
              if grep --quiet "Degree-Uniform Bounds for Polynomial Diophantine Tuples" rendered.html; then
                success=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "Could not retrieve the rendered GitHub page" >&2
            exit 1
          fi

          python - <<'PY'
          from collections import Counter
          from html import unescape
          from pathlib import Path
          import json
          import re

          html = Path("rendered.html").read_text(encoding="utf-8")
          source = json.loads(Path("source-math.json").read_text(encoding="utf-8"))

          forbidden_messages = (
              "The following macros are not allowed",
              "Missing close brace",
              "Undefined control sequence",
              "Math input error",
              "MathJax error",
              "ParseError",
          )
          lowered = html.lower()
          for message in forbidden_messages:
              if message.lower() in lowered:
                  raise SystemExit(f"GitHub rendered an error message: {message}")

          if r"\operatorname" in html:
              raise SystemExit("Rendered HTML still contains a residual operatorname command")

          renderers = re.findall(r"<math-renderer\b.*?</math-renderer>", html, flags=re.DOTALL)
          annotations = [
              unescape(value)
              for value in re.findall(
                  r'<annotation[^>]*encoding="application/x-tex"[^>]*>(.*?)</annotation>',
                  html,
                  flags=re.DOTALL,
              )
          ]

          def normalize(value):
              return re.sub(r"\s+", " ", value).strip()

          source_counter = Counter(normalize(item["tex"]) for item in source)
          annotation_counter = Counter(normalize(value) for value in annotations)
          missing_counter = source_counter - annotation_counter
          extra_counter = annotation_counter - source_counter

          report = [
              f"source expressions: {len(source)}",
              f"math-renderer elements: {len(renderers)}",
              f"TeX annotations: {len(annotations)}",
              f"missing normalized expressions: {sum(missing_counter.values())}",
              f"extra normalized expressions: {sum(extra_counter.values())}",
              "",
              "FIRST MATH-RENDERER SNIPPET",
              renderers[0][:4000] if renderers else "<none>",
              "",
              "MISSING SOURCE EXPRESSIONS",
          ]
          for item in source:
              normalized = normalize(item["tex"])
              if missing_counter[normalized]:
                  report.append(
                      f'{item["kind"]} #{item["index"]}, line {item["line"]}: {item["tex"]!r}'
                  )
                  missing_counter[normalized] -= 1
          report.extend(["", "EXTRA RENDERED ANNOTATIONS"])
          for value, count in extra_counter.items():
              for _ in range(count):
                  report.append(repr(value))

          Path("render-audit.txt").write_text("\n".join(report), encoding="utf-8")
          print("\n".join(report))

          if len(renderers) != len(source):
              raise SystemExit(
                  f"Source/render mismatch: source has {len(source)}, page has {len(renderers)} math-renderer elements"
              )
          if len(annotations) != len(source):
              raise SystemExit(
                  f"Source/annotation mismatch: source has {len(source)}, page has {len(annotations)} TeX annotations"
              )
          if source_counter != annotation_counter:
              raise SystemExit("Rendered TeX annotations do not match the source expression multiset")
          for index, renderer in enumerate(renderers, start=1):
              if not re.search(r"<(?:math|mjx-container)\b", renderer):
                  raise SystemExit(f"Rendered expression #{index} lacks mathematical output")

          print(f"GitHub rendered all {len(source)} source expressions without a detected error")
          PY

      - name: Preserve rendering audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: problem-1-14-render-audit
          path: |
            source-math.json
            rendered.html
            render-audit.txt
          if-no-files-found: warn
          retention-days: 1
