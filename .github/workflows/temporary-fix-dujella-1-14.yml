name: Temporary Problem 1.14 rendering validation

on:
  push:
    branches:
      - fix-dujella-1-14-math-rendering

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the correction branch
        uses: actions/checkout@v4
        with:
          ref: fix-dujella-1-14-math-rendering
          fetch-depth: 0

      - name: Lint the complete mathematical article
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("dujella-problem-1.14/README.md")
          text = path.read_text(encoding="utf-8")

          if "$$" in text:
              raise SystemExit("Forbidden $$ delimiter found")

          forbidden_source_patterns = {
              r"\\operatorname\*?": r"\operatorname",
              r"\\tag\b": r"\tag",
              r"\\boxed\b": r"\boxed",
              r"\\begin\{array\}": r"\begin{array}",
              r"\\newcommand\b": r"\newcommand",
              r"\\renewcommand\b": r"\renewcommand",
              r"\\DeclareMathOperator\b": r"\DeclareMathOperator",
              r"\\def\b": r"\def",
              r"\\require\b": r"\require",
          }
          for pattern, label in forbidden_source_patterns.items():
              if re.search(pattern, text):
                  raise SystemExit(f"Forbidden or unsafe macro found: {label}")

          block_pattern = re.compile(r"```math\n(.*?)\n```", re.DOTALL)
          blocks = block_pattern.findall(text)
          if text.count("```math") != len(blocks):
              raise SystemExit("Unbalanced or malformed math fences")
          if len(blocks) != 90:
              raise SystemExit(f"Expected 90 display-math blocks, found {len(blocks)}")

          without_blocks = block_pattern.sub("", text)
          without_code = re.sub(r"`[^`\n]*`", "", without_blocks)
          inline = re.findall(r"(?<!\\)\$(.+?)(?<!\\)\$", without_code, re.DOTALL)
          if len(inline) != 471:
              raise SystemExit(f"Expected 471 inline expressions, found {len(inline)}")

          expressions = [("block", i + 1, value) for i, value in enumerate(blocks)]
          expressions += [("inline", i + 1, value) for i, value in enumerate(inline)]

          for kind, number, expression in expressions:
              if "<" in expression or ">" in expression:
                  raise SystemExit(f"Literal angle bracket in {kind} math #{number}")

              stack = []
              for match in re.finditer(r"\\(begin|end)\{([^{}]+)\}", expression):
                  action, env = match.groups()
                  if action == "begin":
                      stack.append(env)
                  elif not stack or stack.pop() != env:
                      raise SystemExit(f"Mismatched environment in {kind} math #{number}")
              if stack:
                  raise SystemExit(f"Unclosed environment in {kind} math #{number}: {stack}")

              depth = 0
              escaped = False
              for char in expression:
                  if escaped:
                      escaped = False
                      continue
                  if char == "\\":
                      escaped = True
                      continue
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f"Extra closing brace in {kind} math #{number}")
              if depth:
                  raise SystemExit(f"Unbalanced braces in {kind} math #{number}: depth {depth}")

          required_counts = {
              r"\mathrm{Sq}": 8,
              r"\mathrm{lc}": 2,
              r"\mathrm{rank}": 1,
          }
          for token, expected in required_counts.items():
              actual = text.count(token)
              if actual != expected:
                  raise SystemExit(f"Expected {expected} occurrences of {token}, found {actual}")

          commands = sorted(set(re.findall(r"\\([A-Za-z]+)", "\n".join(value for _, _, value in expressions))))
          print("LaTeX commands used:", ", ".join(commands))
          print(f"Validated {len(blocks)} display blocks and {len(inline)} inline expressions")
          PY

          git diff --check

      - name: Inspect the commit-specific page rendered by GitHub
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          url="https://github.com/natanaelwf/Solving-Open-Problems/blob/${sha}/dujella-problem-1.14/README.md"
          success=0
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error \
              --header "User-Agent: Problem-1.14-render-audit" \
              "$url" > rendered.html; then
              if grep --quiet "Degree-Uniform Bounds for Polynomial Diophantine Tuples" rendered.html; then
                success=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "Could not retrieve the rendered GitHub page" >&2
            exit 1
          fi

          forbidden_messages=(
            "The following macros are not allowed"
            "Missing close brace"
            "Undefined control sequence"
            "Math input error"
            "MathJax error"
            "ParseError"
          )
          for message in "${forbidden_messages[@]}"; do
            if grep --fixed-strings --ignore-case --quiet "$message" rendered.html; then
              echo "GitHub rendered an error message: $message" >&2
              grep --fixed-strings --ignore-case "$message" rendered.html >&2 || true
              exit 1
            fi
          done

          if grep --fixed-strings --quiet '\operatorname' rendered.html; then
            echo "The rendered HTML still contains a residual operatorname command" >&2
            exit 1
          fi

          math_count="$(grep -o '<math-renderer' rendered.html | wc -l | tr -d ' ')"
          echo "GitHub page retrieved successfully; math-renderer elements found: ${math_count}"
