name: Assemble Problem 4.4 publication

on:
  push:
    branches:
      - publish-dujella-problem-4.4-20261002

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.head_commit.message == 'Assemble Problem 4.4 publication'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publish-dujella-problem-4.4-20261002

      - name: Assemble and verify publication files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dujella-problem-4.4

          python - <<'PY'
          from hashlib import sha1
          from pathlib import Path

          path = Path('.publish/problem.b64.01')
          raw = path.read_bytes()
          expected = 'd823b7307e9c9980686b6c1a15d6675e35fa2375'

          def git_blob_sha(data: bytes) -> str:
              return sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          assert len(raw) == 10004
          corrected = None
          for i in range(len(raw) - 3):
              candidate = raw[:i] + raw[i + 4:]
              if git_blob_sha(candidate) == expected:
                  print(f'Removed duplicated bytes at offset {i}: {raw[i:i+4]!r}')
                  corrected = candidate
                  break
          assert corrected is not None, 'unable to reconstruct exact second chunk'
          Path('.publish/problem.b64.01.corrected').write_bytes(corrected)
          PY

          cat \
            .publish/problem.b64.00 \
            .publish/problem.b64.01.corrected \
            .publish/problem.b64.02 \
            .publish/problem.b64.03 \
            | base64 --decode > dujella-problem-4.4/README.md
          cat .publish/root.b64.* | base64 --decode > README.md

          problem_sha="$(git hash-object dujella-problem-4.4/README.md)"
          root_sha="$(git hash-object README.md)"
          echo "Problem README blob: ${problem_sha}"
          echo "Root README blob: ${root_sha}"
          test "${problem_sha}" = "2fb235af82f343db8580880e5d7f85e89adfcfe1"
          test "${root_sha}" = "9641b9ce672d585f3d8db45db0ee1b0eef4c2351"

          python - <<'PY'
          from pathlib import Path

          text = Path('dujella-problem-4.4/README.md').read_text(encoding='utf-8')
          assert '$$' not in text
          assert '\\tag' not in text
          assert '\\boxed' not in text
          assert '\\begin{array}' not in text

          in_math = False
          openings = 0
          closings = 0
          for line_number, line in enumerate(text.splitlines(), 1):
              stripped = line.strip()
              if stripped == '```math':
                  assert not in_math, f'nested math fence at line {line_number}'
                  in_math = True
                  openings += 1
                  continue
              if stripped == '```':
                  assert in_math, f'closing fence outside math at line {line_number}'
                  in_math = False
                  closings += 1
                  continue
              if in_math:
                  assert '<' not in line and '>' not in line, f'literal relation at line {line_number}'
          assert not in_math, 'unclosed math fence'
          assert openings == closings
          print(f'Validated {openings} balanced math blocks')
          PY

          rm -rf .publish
          rm -f .github/workflows/assemble-problem-4.4.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete solution to Dujella's Problem 4.4"
          git push origin HEAD:publish-dujella-problem-4.4-20261002
