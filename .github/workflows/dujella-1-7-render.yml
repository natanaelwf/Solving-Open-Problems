name: Dujella 1.7 publication audit
on:
  push:
    branches: [review/dujella-1-7-2026-10-14]
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/review/dujella-1-7-2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.head.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply a checked, one-time typography patch
        run: |
          if test -f publication-audit/patch.py; then
            python publication-audit/patch.py
            python publication-audit/check_source.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm publication-audit/patch.py
            git add dujella-problem-1.7/README.md publication-audit/check_source.py publication-audit/render.mjs
            git commit -m 'Preserve set braces and reflow long equations for narrow screens'
            git push origin HEAD:refs/heads/review/dujella-1-7-2026-10-14
          fi
      - name: Record the exact candidate commit
        id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  audit:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the verification tools
        run: |
          python -m pip install -r dujella-problem-1.7/requirements.txt
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Re-run all exact arithmetic checks
        run: |
          mkdir -p publication-audit/evidence
          python dujella-problem-1.7/verify.py --full --output publication-audit/evidence/final-verification.json
          python publication-audit/compare_results.py
          python publication-audit/check_source.py > publication-audit/evidence/source-check.txt
      - name: Inspect actual GitHub HTML and browser rendering
        env:
          AUDIT_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node publication-audit/render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dujella-1-7-live-audit-${{ needs.prepare.outputs.commit }}
          path: publication-audit/evidence/
          if-no-files-found: error
          retention-days: 30
