name: Dujella 1.7 publication audit
on:
  push:
    branches: [main, review/dujella-1-7-2026-10-14]
    paths:
      - README.md
      - dujella-problem-1.7/**
      - publication-audit/**
      - .github/workflows/dujella-1-7-render.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dujella-1-7-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the verification tools
        run: |
          python -m pip install -r dujella-problem-1.7/requirements.txt
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Re-run all exact arithmetic checks
        run: |
          mkdir -p publication-audit/evidence
          python dujella-problem-1.7/verify.py --full --output publication-audit/evidence/final-verification.json
          python publication-audit/compare_results.py
          python publication-audit/check_source.py > publication-audit/evidence/source-check.txt
      - name: Inspect actual GitHub HTML and browser rendering
        env:
          AUDIT_COMMIT: ${{ github.sha }}
        run: node publication-audit/render.mjs
      - name: Check editorial fields, native scrollers and all published files
        env:
          AUDIT_COMMIT: ${{ github.sha }}
        run: node publication-audit/editorial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dujella-1-7-live-audit-${{ github.sha }}
          path: publication-audit/evidence/
          if-no-files-found: error
          retention-days: 90
