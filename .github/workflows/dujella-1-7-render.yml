name: Dujella 1.7 publication audit
on:
  push:
    branches: [review/dujella-1-7-2026-10-14]
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/review/dujella-1-7-2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.head.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect the one-time checked transfer
        id: transport
        run: |
          if test -f publication-audit/transfer-1.txt; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore audited sources and update the index
        if: steps.transport.outputs.needed == 'true'
        run: |
          python publication-audit/unpack.py
          python publication-audit/update_index.py
          python publication-audit/check_source.py
          mkdir -p publication-audit/evidence
      - name: Build the unchanged manuscript in Debian trixie
        if: steps.transport.outputs.needed == 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work debian:trixie-slim sh -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern
            cd dujella-problem-1.7
            pdflatex -interaction=nonstopmode -halt-on-error paper.tex > /work/publication-audit/evidence/latex-first.log
            pdflatex -interaction=nonstopmode -halt-on-error paper.tex > /work/publication-audit/evidence/latex-second.log
            chmod a+rw paper.pdf
          '
          python publication-audit/restore_pdf_metadata.py
      - name: Commit only the candidate branch
        if: steps.transport.outputs.needed == 'true'
        run: |
          git rm publication-audit/transfer-*.txt publication-audit/macro-fixture.md publication-audit/smoke.mjs
          rm -f publication-audit/unpack.py publication-audit/update_index.py publication-audit/restore_pdf_metadata.py
          rm -f dujella-problem-1.7/paper.aux dujella-problem-1.7/paper.log dujella-problem-1.7/paper.out
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md dujella-problem-1.7
          git add -u publication-audit
          git add publication-audit/*.py publication-audit/*.mjs publication-audit/*.json
          git commit -m 'Add the full Problem 1.7 manuscript, official-source PDF and exact verifier'
          git push origin HEAD:refs/heads/review/dujella-1-7-2026-10-14
      - name: Record the exact candidate commit
        id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.transport.outputs.needed == 'true'
        with:
          name: dujella-1-7-pdf-build-${{ github.run_id }}
          path: |
            publication-audit/evidence/
            dujella-problem-1.7/paper.pdf
          if-no-files-found: warn
          retention-days: 30
  audit:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the verification tools
        run: |
          python -m pip install -r dujella-problem-1.7/requirements.txt
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Re-run all exact arithmetic checks
        run: |
          mkdir -p publication-audit/evidence
          python dujella-problem-1.7/verify.py --full --output publication-audit/evidence/final-verification.json
          python publication-audit/compare_results.py
          python publication-audit/check_source.py > publication-audit/evidence/source-check.txt
      - name: Inspect actual GitHub HTML and browser rendering
        env:
          AUDIT_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node publication-audit/render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dujella-1-7-live-audit-${{ needs.prepare.outputs.commit }}
          path: publication-audit/evidence/
          if-no-files-found: error
          retention-days: 30
