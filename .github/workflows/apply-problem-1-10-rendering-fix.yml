name: Apply validated rendering fix for Problem 1.10

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-problem-1-10-rendering-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Install the validated README files
        env:
          ARTICLE_GZ_B64: 
          ROOT_GZ_B64: 
        run: |
          set -euo pipefail
          cd repo
          printf '%s' "$ARTICLE_GZ_B64" | base64 --decode | gzip --decompress > dujella-problem-1.10/README.md
          printf '%s' "$ROOT_GZ_B64" | base64 --decode | gzip --decompress > README.md

          test "$(git hash-object dujella-problem-1.10/README.md)" = "fd860ff40021a7fbc03281de70f5056fa1e2d089"
          test "$(git hash-object README.md)" = "8f96eba4515e0d239471a9e03bc92752c60ae58d"

          python3 - <<'PY_CHECK'
          from pathlib import Path
          import re

          path = Path('dujella-problem-1.10/README.md')
          text = path.read_text(encoding='utf-8')

          assert '$$' not in text
          assert r'\left' not in text
          assert r'\right' not in text
          assert text.count('```math') == 55
          assert text.count('```') == 110

          without_blocks = re.sub(r'```math\n.*?\n```', '', text, flags=re.S)
          protected = re.findall(r'\$`[^`\n]+`\$', without_blocks)
          assert len(protected) == 226
          without_inline = re.sub(r'\$`[^`\n]+`\$', '', without_blocks)
          assert '$' not in without_inline

          forbidden = (
              r'\left', r'\right', r'\tag', r'\operatorname',
              r'\mathrm{UT}2', 'Q{n+1}', '-$`', '`$-',
              'Missing or unrecognized delimiter',
              'Extra open brace or missing close brace',
          )
          for token in forbidden:
              assert token not in text, token

          assert text.count('```') % 2 == 0
          assert len(text.splitlines()) == 587
          print('README structural validation passed.')
          PY_CHECK

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dujella-problem-1.10/README.md
          git commit -m "Fix GitHub rendering for Dujella Problem 1.10"
          git push origin HEAD:main
